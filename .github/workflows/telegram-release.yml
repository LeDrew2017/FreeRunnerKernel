name: Post Release to Telegram

on:
  release:
    types: [published]

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyTelegramBotAPI

      - name: Read Changelog
        id: changelog
        run: echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_ENV && cat changelog.md >> $GITHUB_ENV && echo "EOF" >> $GITHUB_ENV

      - name: Run Kernel Release Poster Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ env.CHANGELOG_CONTENT }}
        run: |
          python .github/scripts/kernel_release_post.py
